version: "3.9"


services:

  network-ai-agent:

    build:
      context: .

    container_name:
      network-ai-agent


    ports:

      - "8000:8000"


    env_file:

      - .env


    volumes:

      - ./knowledge:/app/knowledge

      - ./vector_db:/app/vector_db


    restart:
      unless-stopped