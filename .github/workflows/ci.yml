name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --check .
      - run: docker build -t network-ai-agent:ci .
      - name: Offline smoke test
        shell: bash
        run: |
          docker run -d --name agent-ci -p 127.0.0.1:8000:8000 -e MODEL_PROVIDER=demo -e ENABLE_RAG=false network-ai-agent:ci
          trap 'docker logs agent-ci; docker rm -f agent-ci' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -H 'Content-Type: application/json' -d '{"question":"DNS failure"}' http://127.0.0.1:8000/api/v1/diagnose > response.json
          python -c 'import json; r=json.load(open("response.json")); assert r["status"] == "demo"'
